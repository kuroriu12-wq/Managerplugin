name: spike-apk

on:
  push:
    branches: ['spike/**']
    paths:
      - 'spikes/sandbox-spike/**'
      - '.github/workflows/spike-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Build debug APK
        working-directory: spikes/sandbox-spike
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Report resolved library versions and ABIs
        working-directory: spikes/sandbox-spike
        run: |
          gradle --no-daemon -q :app:dependencies --configuration debugRuntimeClasspath | grep -E 'rhino|quickjs' | sort -u | tee /tmp/versions.txt || true
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E '\.so$' | tee /tmp/abis.txt || true
      - name: Publish APK as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp spikes/sandbox-spike/app/build/outputs/apk/debug/app-debug.apk sandbox-spike-${{ github.run_number }}.apk
          {
            echo "Debug build of the sandbox spike (commit ${GITHUB_SHA}). Not for normal use."
            echo
            echo 'Resolved libraries:'
            cat /tmp/versions.txt
            echo
            echo 'Native libraries in the APK:'
            cat /tmp/abis.txt
          } > /tmp/notes.md
          gh release create "spike-${{ github.run_number }}" "sandbox-spike-${{ github.run_number }}.apk" --prerelease --title "Sandbox spike ${{ github.run_number }}" --notes-file /tmp/notes.md --target "${GITHUB_SHA}"
